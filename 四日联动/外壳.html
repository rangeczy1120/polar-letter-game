<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>极夜来信 · 四日联动</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080f;color:#fff;font-family:system-ui}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;visibility:hidden;pointer-events:none}iframe.active{visibility:visible;pointer-events:auto}#cover{position:fixed;inset:0;z-index:4;background:#05080f;display:grid;place-content:center;text-align:center;transition:opacity 1.3s}#cover.clear{opacity:0;pointer-events:none}#intro{position:fixed;inset:0;z-index:6;background:#0b1b2e;display:grid;place-content:center;text-align:center}#intro[hidden]{display:none}button{padding:12px 30px;border:0;border-radius:30px;background:#f5d7ac;font-size:18px}#error{position:fixed;bottom:0;z-index:8;background:#5d2525;padding:1em}#error[hidden]{display:none}</style></head><body><iframe id="warm" title="温馨世界" allow="autoplay"></iframe><iframe id="horror" title="恐怖世界" allow="autoplay"></iframe><div id="cover"><span id="dayLabel"></span></div><div id="intro"><h1>极夜来信</h1><p>四日联动</p><button id="begin">开始旅程</button></div><div id="error" hidden></div><script>
/* DATA */
const frames={warm:document.getElementById('warm'),horror:document.getElementById('horror')},cover=document.getElementById('cover'),label=document.getElementById('dayLabel'),error=document.getElementById('error');let day=1,world='warm',busy=true,nightLoaded=false;
const wait=n=>new Promise(r=>setTimeout(r,n));function decode(s){let t=atob(s),b=new Uint8Array(t.length);for(let i=0;i<t.length;i++)b[i]=t.charCodeAt(i);return new TextDecoder().decode(b)}
function load(name){return new Promise((resolve,reject)=>{const f=frames[name];f.onload=()=>{f.onload=null;resolve()};f.onerror=()=>reject(Error('无法加载'+name));f.srcdoc=decode(DATA[name])})}
function pause(name){try{frames[name].contentWindow.__mergeAudio?.pause()}catch(e){}}
function isVisible(e,w){if(!e||e.hidden)return false;let s=w.getComputedStyle(e);return s.display!=='none'&&s.visibility!=='hidden'&&e.getClientRects().length>0}
async function change(next,number){if(busy)return;busy=true;cover.className='';label.textContent='第 '+number+' 天';await wait(1300);pause(world);frames[world].classList.remove('active');if(next==='horror'&&!nightLoaded){await load('horror');frames.horror.contentWindow.eval('CH.day=2');nightLoaded=true}if(next==='warm')frames.warm.contentDocument.getElementById('wake').click();if(next==='horror'&&number===4){frames.horror.contentWindow.eval('chDayBreak(4)');await wait(1800)}world=next;day=number;frames[world].classList.add('active');await wait(1300);cover.className='clear';await wait(1300);frames[world].contentWindow.focus();busy=false}
function watch(){setInterval(()=>{if(busy)return;try{if(world==='warm'&&(day===1||day===3)&&isVisible(frames.warm.contentDocument.getElementById('rest'),frames.warm.contentWindow))change('horror',day+1).catch(fail);else if(world==='horror'&&day===2&&frames.horror.contentWindow.eval('typeof CH !== "undefined" && CH.day === 3 && !CH.dayBreak'))change('warm',3).catch(fail)}catch(e){fail(e)}},350)}
function fail(e){busy=true;error.hidden=false;error.textContent='联动暂时中断：'+e.message}
document.getElementById('begin').onclick=async()=>{document.getElementById('intro').hidden=true;try{await load('warm');frames.warm.classList.add('active');label.textContent='第 1 天';await wait(1200);cover.className='clear';await wait(1300);busy=false;frames.warm.contentWindow.focus();watch()}catch(e){fail(e)}};
</script></body></html>
