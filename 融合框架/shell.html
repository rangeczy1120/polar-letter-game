<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>极夜来信 · 双世界</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;color:#f8eddb;font-family:system-ui,sans-serif}iframe{border:0;width:100%;height:100%}#cover{position:fixed;inset:0;background:#030508;display:flex;align-items:center;justify-content:center;z-index:3;transition:opacity 1.3s ease}#cover.clear{opacity:0;pointer-events:none}#cover.seam{background:radial-gradient(ellipse 80% 3% at center,var(--light),#030508 85%)}#start,#end{position:fixed;z-index:5;inset:0;display:grid;place-content:center;text-align:center;background:#081627;padding:2rem}#start[hidden],#end[hidden]{display:none}button{padding:.8rem 1.8rem;background:#ead0a0;border:0;border-radius:3rem;cursor:pointer;font-size:1rem}#notice{position:fixed;z-index:6;bottom:1em;left:1em;right:1em;color:#fff;background:#301922;padding:.7em}#notice[hidden]{display:none}
</style></head><body><iframe id="game" title="极夜来信游戏世界" allow="autoplay"></iframe><div id="cover"></div><div id="start"><h1>极夜来信</h1><p>白昼与长夜之间，故事静静流转。</p><button id="begin">开始旅程</button></div><div id="end" hidden><h2>这一段旅程暂告一段落</h2><p>后续结局尚待两组共同完成。</p></div><div id="notice" hidden></div><script>
/*__GAME_DATA__*/
const frame=document.getElementById('game'),cover=document.getElementById('cover'),notice=document.getElementById('notice');let world='warm',cycle=1,locked=true,url=null,timer=null;
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
function bytes(b64){const bin=atob(b64),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
function load(kind){return new Promise((resolve,reject)=>{frame.onload=()=>{frame.onload=null;resolve()};frame.onerror=()=>reject(Error('世界加载失败'));frame.srcdoc=new TextDecoder().decode(bytes(GAME_DATA[kind]))})}
function visible(el,win){if(!el||el.hidden)return false;const s=win.getComputedStyle(el);return s.display!=='none'&&s.visibility!=='hidden'&&el.getClientRects().length>0}
async function transition(next){locked=true;clearInterval(timer);cover.className='';await wait(1000);frame.removeAttribute('srcdoc');frame.src='about:blank';await wait(300);if(next==='end'){document.getElementById('end').hidden=false;cover.className='clear';return}await load(next);cover.style.setProperty('--light',next==='horror'?'#bd7781':'#f5d5a0');cover.className='seam';await wait(1500);cover.className='clear';await wait(1400);world=next;locked=false;frame.contentWindow.focus();watch()}
function watch(){timer=setInterval(()=>{if(locked)return;try{const el=frame.contentDocument.getElementById(GAME_DATA.signals[world]);if(visible(el,frame.contentWindow)){if(world==='horror'){cycle++;transition(cycle>GAME_DATA.cycles?'end':'warm')}else transition('horror')}}catch(e){clearInterval(timer);notice.hidden=false;notice.textContent='无法读取游戏信号：'+e.message}},250)}
document.getElementById('begin').addEventListener('click',async()=>{document.getElementById('start').hidden=true;try{await transition('warm')}catch(e){notice.hidden=false;notice.textContent='加载失败：'+e.message}});
</script></body></html>
